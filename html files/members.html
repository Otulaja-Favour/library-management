<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Portal - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand animate_animated animatepulse animate_infinite" href="members.html">
                <i class="bi bi-book"></i> Library 
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                      <li class="nav-item">
                        <a class="nav-link" href="./members.html">Home</a>
                    </li> 
                </ul>
                <form class="d-flex" id="userSearchForm">
                    <button class="btn btn-outline-light" type="submit" ><a href="../html files/index.html" style="color:  white; text-decoration: none;">Logout</a></button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- User Profile Card -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm animate_animated animate_fadeIn">
                    <div class="card-body text-center">
                        <img id="memberimg" src="../image/Download User Profile Icon for free.jpeg" class="rounded-circle mb-3" alt="">
                        <h3 id="userName">Welcome</h3>
                        <button class="btn btn-primary" id="editProfileBtn">Edit Profile</button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm animate_animated animate_fadeIn">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">My Library</h4>
                    </div>
                    <div class="card-body">
                        <ul class="nav nav-tabs" id="userLibraryTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="borrowed-tab" data-bs-toggle="tab" data-bs-target="#borrowed" type="button" role="tab">Currently Borrowed <span class="badge text-bg-secondary ml-2" id="amount">4</span></button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history" type="button" role="tab">Borrowing History</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="wishlist-tab" data-bs-toggle="tab" data-bs-target="#wishlist" type="button" role="tab">Wishlist</button>
                            </li>
                        </ul>
                        <div class="tab-content p-3" id="userLibraryTabContent">
                            <div class="tab-pane fade show active" id="borrowed" role="tabpanel">
                                <div id="borrowedBooks" class="row">
                                    <!-- Borrowed books will be loaded here -->
                                    <p class="text-center text-muted">You haven't borrowed any books yet.</p>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="history" role="tabpanel">
                                <div id="historyBooks" class="row">
                                    <!-- History will be loaded here -->
                                    <p class="text-center text-muted">No borrowing history found.</p>
                                </div>
                            </div>
                            <div class="tab-pane fade" id="wishlist" role="tabpanel">
                                <div id="wishlistBooks" class="row">
                                    <!-- Wishlist will be loaded here -->
                                    <p class="text-center text-muted">Your wishlist is empty.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Results Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm animate_animated animate_fadeIn">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Book Catalog</h4>
                        <div class="d-flex">
                            <input class="form-control me-2" type="search" id="userSearchInput"  placeholder="Search books...">

                            <button class="btn btn-light" id="refreshCatalog">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row" id="bookCatalog">
                            <!-- Books will be loaded here dynamically -->
                            <div class="d-flex justify-content-center" id="task" style="display: flex; flex-wrap: wrap;">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>

                            </div>
                        </div>
                        <div class="d-flex justify-content-center mt-4">
                            <!-- <button class="btn btn-primary" id="loadMoreBtn">Load More</button> -->
                            <div id="pagination" style="display: block;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="bookToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="toast-header">
            <!-- <img src="https://www.pinterest.com/pin/133559945194339072/" class="rounded me-2" alt="Book Icon"> -->
            <svg class="bd-placeholder-img rounded me-2" width="20" height="20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice" focusable="false"><rect width="100%" height="100%" fill="#007aff"></rect></svg> 
            <strong class="me-auto">Your Book</strong>
            <small class="text-muted">just now</small>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
          <div class="toast-body">
            Book action completed.
          </div>
        </div>
      </div>


      <div class="modal fade" id="userInfoModal" tabindex="-1" role="dialog" aria-labelledby="userInfoModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="userInfoModalLabel">Welcome! Please Enter Your Information</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form id="userInfoForm">
                <div class="form-group">
                  <label for="userName">Name</label>
                  <input type="text" class="form-control" id="userName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                  <label for="userEmail">Email address</label>
                  <input type="email" class="form-control" id="userEmail" placeholder="Enter your email" required>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
              <button type="button" class="btn btn-primary" id="saveUserInfo">Save</button>
            </div>
          </div>
        </div>
      </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <!-- <script src="../js file/login.js"></script> -->
     
    <script  src="../js file/members.js"></script>
    
</body>
</html>
